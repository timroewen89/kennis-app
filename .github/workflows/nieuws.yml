# Ververst twee keer per dag news.json met het nieuws van de dag.
# Geplande runs werken alleen vanaf de standaard-branch (main).
name: Nieuws verversen

on:
  schedule:
    # Bewust niet op het hele uur: dan is het bij GitHub het drukst en worden geplande runs
    # vertraagd of overgeslagen. Tijden in UTC; Nederland is één (winter) of twee (zomer) uur later.
    - cron: '17 4 * * *' # 's ochtends vroeg
    - cron: '17 11 * * *' # rond het middaguur
  workflow_dispatch: # ook handmatig te starten via het tabblad Actions

permissions:
  contents: write # nodig om news.json te kunnen committen

concurrency:
  group: nieuws
  cancel-in-progress: true

jobs:
  nieuws:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Het script heeft geen pakketten nodig en draait op de Node die al op de runner staat (18 of nieuwer).
      # Hoe minder onderdelen van buiten in deze workflow, hoe beter: hij mag naar main schrijven.
      - name: Nieuws ophalen
        run: node scripts/fetch-news.mjs
      - name: news.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Nieuws van $(date -u +%Y-%m-%d)"
          # Is main intussen veranderd, dan eerst bijwerken en opnieuw proberen. Bij een botsing
          # in news.json wint de versie van deze run ('theirs' is bij een rebase de eigen commit).
          for poging in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Poging $poging mislukt; opnieuw"; sleep 5
          done
          echo "Pushen is drie keer mislukt"; exit 1
