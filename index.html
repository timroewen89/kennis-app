<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- De pagina mag alleen eigen bestanden laden en alleen verbinding maken met Wikipedia en de vertaaldienst. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.wikimedia.org https://api.mymemory.translated.net; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="description" content="Eén eindige editie per dag. Lees, leer en leg je telefoon weg.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kennis — je dagelijkse editie</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Kennis</h1>
      <p class="top__date" id="date"></p>
    </div>
    <div class="top__right">
      <button type="button" class="streak" id="toggle-progress" title="Voortgang bekijken"><span aria-hidden="true">🔥</span> <span id="streak">0</span><span class="sr-only" id="streak-label"></span></button>
      <button type="button" class="btn btn--ghost btn--small" id="toggle-saved"></button>
      <button type="button" class="btn btn--ghost btn--small icon-btn" id="toggle-topics" aria-label="Instellingen" title="Instellingen">⚙</button>
    </div>
  </header>
  <!-- Voor schermlezers: meldt bij het bladeren op welke kaart je bent. -->
  <p class="sr-only" id="announce" aria-live="polite"></p>
  <main id="main"><p class="loading">Editie laden…</p></main>
  <noscript><p class="notice">Deze pagina heeft JavaScript nodig.</p></noscript>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
